<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTTP Tester</title>
<style>
  :root { --radius: 1rem; }
  body { margin: 0; padding: 1rem; font-family: system-ui, sans-serif;
    background: hsl(var(--surface)); color: hsl(var(--on-surface)); }
  .card { background: hsl(var(--surface-bright)); border: 1px solid hsl(var(--surface-variant) / 0.4);
    border-radius: var(--radius); padding: 1rem; }
  h2 { margin: 0 0 0.25rem; font-size: 1.05rem; }
  .sub { font-size: 0.75rem; color: hsl(var(--on-surface-variant)); margin-bottom: 1rem; }
  .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.2rem;
    border-radius: 999px; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 600;
    background: hsl(var(--primary)); color: hsl(var(--on-primary)); }
  .btn:active { transform: scale(0.97); }
  .status { display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; font-size: 0.8rem; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--surface-variant)); }
  .dot.ok { background: #4ade80; } .dot.fail { background: #f87171; }
  .hint { margin-top: 0.75rem; font-size: 0.7rem; color: hsl(var(--on-surface-variant)); }
</style>
</head>
<body>
<div class="card">
  <h2 id="title">HTTP 测试器</h2>
  <p class="sub" id="sub">请求 https://api.github.com/zen，结果将系统通知</p>
  <button class="btn" id="ping">测试连接</button>
  <div class="status"><span class="dot" id="dot"></span><span id="state">—</span></div>
  <p class="hint">通过宿主 http_request 异步请求，响应经 http:response 消息回传</p>
</div>
<script>
  const T = { 'zh-CN': { t: 'HTTP 测试器', s: '请求 https://api.github.com/zen，结果将系统通知', b: '测试连接', ok: '上次测试成功', fail: '上次测试失败', none: '尚未测试' },
    'zh-TW': { t: 'HTTP 測試器', s: '請求 https://api.github.com/zen，結果將系統通知', b: '測試連線', ok: '上次測試成功', fail: '上次測試失敗', none: '尚未測試' },
    en: { t: 'HTTP Tester', s: 'Requests https://api.github.com/zen, result via system notification', b: 'Test Connection', ok: 'Last test OK', fail: 'Last test failed', none: 'Not tested yet' } };
  function pick(locale) {
    if (locale.startsWith('zh')) return T['zh-CN'];
    if (locale.startsWith('en')) return T.en;
    return T.en;
  }
  function call(api, args) { return new Promise((res) => {
    const id = Date.now() + Math.random();
    window.parent.postMessage({ __micyou: 1, id, api, args }, '*');
    const onMsg = (e) => {
      const d = e.data;
      if (d && d.__micyou === 1 && d.id === id) { window.removeEventListener('message', onMsg); res(d); }
    };
    window.addEventListener('message', onMsg);
    setTimeout(() => { window.removeEventListener('message', onMsg); res(null); }, 10000);
  }); }
  (async function init() {
    let locale = 'en';
    try { const r = await call('locale'); locale = (r && r.data) || 'en'; } catch (e) { /* en */ }
    const t = pick(locale);
    document.getElementById('title').textContent = t.t;
    document.getElementById('sub').textContent = t.s;
    document.getElementById('ping').textContent = t.b;
    let last = '';
    try { const r = await call('get_config', { key: 'lastCheck' }); last = (r && r.data) || ''; } catch (e) { /* ignore */ }
    renderState(last);
    document.getElementById('ping').onclick = () => {
      call('trigger', { action: 'ping' });
      const s = document.getElementById('state'); s.textContent = '…'; s.style.color = 'hsl(var(--on-surface-variant))';
    };
    function renderState(v) {
      const dot = document.getElementById('dot'); const s = document.getElementById('state');
      if (v === 'ok') { dot.className = 'dot ok'; s.textContent = t.ok; }
      else if (v === 'fail') { dot.className = 'dot fail'; s.textContent = t.fail; }
      else { dot.className = 'dot'; s.textContent = t.none; }
    }
  })();
</script>
</body>
</html>
