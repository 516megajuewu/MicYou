[package]
name = "micyou-plugin"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "MicYou plugin framework: unified plugin abstraction, dual runtime (native cdylib + WASM), DSP node registration and cross-device sync protocol"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.32"
semver = "1"

[features]
default = []
# Compile the C ABI native fixture used by the native loader tests
test-fixtures = []
